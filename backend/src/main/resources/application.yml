server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: ecommerce-api

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none   # ? CORRIGIDO: Forçado 'none' pois o Flyway controla o schema
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.ecomerce: DEBUG # ? CORRIGIDO: Alinhado para o nome real do seu pacote Java
    org.hibernate.SQL: DEBUG

# ? Bloco único de parâmetros customizados da sua aplicação
app:
  jwt:
    secret: "uma_chave_secreta_padrao_muito_longa_com_mais_de_256_bits_para_o_ecommerce" # ? Lembre-se de usar uma string longa
    expiration-ms: 86400000  # 24h
  upload:
    dir: ./uploads/products
    public-path: /files/products
